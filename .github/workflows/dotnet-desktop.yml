name: Build C++ WinForms and Setup

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Добавляем исполняемые файлы Visual Studio (devenv.exe) в PATH
    - name: Add MSBuild and Devenv to PATH
      uses: microsoft/setup-msbuild@v2

    # 2. Включаем сборку .vdproj в реестре Windows (иначе devenv выдаст ошибку)
    - name: Enable VDPROJ builds in Visual Studio
      run: |
        reg add "HKCU\Software\Microsoft\VisualStudio\17.0_Config\ExtensionManager\ExtensionApps" /v "DisableOutProcBuild" /t REG_DWORD /d 0 /f

    # 3. Восстанавливаем пакеты NuGet для конкретного проекта (если используются)
    - name: Restore NuGet Packages
      run: |
        nuget restore YourProjectName.vcxproj -SolutionDirectory ./

    # 4. Собираем сам C++ WinForms проект (замените YourProjectName.vcxproj)
    - name: Build C++ WinForms Project
      run: |
        msbuild YourProjectName.vcxproj /p:Configuration=Release /p:Platform="x64"

    # 5. Собираем установщик MSI через devenv (замените YourSetupProjectName.vdproj)
    - name: Build MSI Installer
      run: |
        devenv.com YourSetupProjectName.vdproj /Build "Release|x64"

    # 6. Выгружаем готовый установщик и .exe в артефакты GitHub
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinForms-Setup-Package
        path: |
          ./x64/Release/**/*.exe
          ./x64/Release/**/*.msi
          ./x64/Release/**/*.ash
