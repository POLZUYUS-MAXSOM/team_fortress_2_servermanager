        .stats {

            color: #555;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 10px 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #eaeaea;
            vertical-align: top;
        }

        tr:hover {
            background: #f0f8ff;
        }

        .cmd {
            font-weight: 600;
            color: #2980b9;
            white-space: nowrap;
        }

        .type {
            font-weight: 500;
            color: #7f8c8d;
        }

        .flags {
            color: #27ae60;
            font-size: 12px;
            background: #eafaf1;
            padding: 2px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .desc {
            color: #2c3e50;
        }

        .no-results {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 18px;
        }

        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }

            .note code {
                background: #f8f9fa;
                padding: 2px 6px;
                border-radius: 3px;
            }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                display: none;
            }

            tr {
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 4px;
                padding: 10px;
            }

            td {
                border: none;
                padding: 5px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

                td:before {
                    content: attr(data-label);
                    font-weight: bold;
                    color: #555;
                    margin-right: 10px;
                }

            .flags {
                background: none;
                padding: 0;
            }
        }

        { name: "xc_crouch_debounce", type: "cmd", flags: "0", desc: "game" },
        { name: "xload", type: "cmd", flags: "cmd", desc: "Load a saved game from a 360 storage device." },
        { name: "xlook", type: "cmd", flags: "cmd", desc: "client" },
        { name: "xmove", type: "cmd", flags: "cmd", desc: "client" },
        { name: "xsave", type: "cmd", flags: "cmd", desc: "norecord\tSaves current game to a 360 storage device." },
        { name: "youtube_http_proxy", type: "cmd", flags: "client archive", desc: "HTTP proxy.  Specify if you have have problems uploading to YouTube." },
        { name: "youtube_username", type: "cmd", flags: "client archive", desc: "Username for YouTube." },
        { name: "+zoom", type: "cmd", flags: "cmd", desc: "client" },
        { name: "-zoom", type: "cmd", flags: "cmd", desc: "client" },
        { name: "zoom_sensitivity_ratio", type: "cmd", flags: "1.0", desc: "client archive\tAdditional mouse sensitivity scale factor applied when FOV is zoomed in." }
        ];

        // =======================================================

        // HTML escaping function (for security)
        function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Render table
        function renderTable(data) {
        var tbody = document.getElementById('cmdBody');
        if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="no-results">No results found</td></tr>';
        return;
        }
        var html = '';
        for (var i = 0; i < data.length; i++) {
        var cmd = data[i];
        html += '<tr>' +
        '<td data-label="Command" class="cmd">' + escapeHtml(cmd.name) + '</td>' +
        '<td data-label="Type" class="type">' + escapeHtml(cmd.type) + '</td>' +
        '<td data-label="Flags"><span class="flags">' + escapeHtml(cmd.flags || '—') + '</span></td>' +
        '<td data-label="Description" class="desc">' + escapeHtml(cmd.desc || '—') + '</td>' +
        '</tr>';
        }
        tbody.innerHTML = html;
        document.getElementById('stats').textContent = 'Entries: ' + data.length;
        }

        // Filter function (uses indexOf for IE compatibility)
        function filterTable() {
        var search = document.getElementById('searchInput').value.toLowerCase();
        var typeFilter = document.getElementById('typeFilter').value;
        var filtered = [];
        for (var i = 0; i < commands.length; i++) {
        var cmd = commands[i];
        var matchType = (typeFilter === 'all' || cmd.type === typeFilter);
        var matchSearch = false;
        if (matchType) {
        matchSearch = (cmd.name || '').toLowerCase().indexOf(search) !== -1 ||
        (cmd.desc || '').toLowerCase().indexOf(search) !== -1 ||
        (cmd.flags || '').toLowerCase().indexOf(search) !== -1;
        }
        if (matchType && matchSearch) {
        filtered.push(cmd);
        }
        }
        renderTable(filtered);
        }

        // Initialization (compatible with IE)
        function init() {
        renderTable(commands);
        var searchInput = document.getElementById('searchInput');
        var typeFilter = document.getElementById('typeFilter');
        if (searchInput.addEventListener) {
        searchInput.addEventListener('keyup', filterTable);
        typeFilter.addEventListener('change', filterTable);
        } else if (searchInput.attachEvent) {
        searchInput.attachEvent('onkeyup', filterTable);
        typeFilter.attachEvent('onchange', filterTable);
        }
        }

        // Run on load
        if (window.addEventListener) {
        window.addEventListener('load', init);
        } else if (window.attachEvent) {
        window.attachEvent('onload', init);
        } else {
        window.onload = init;
        }

        // Console stub for CHM compatibility
        if (typeof console === 'undefined') {
        var console = { log: function() {}, error: function() {} };
        }
    </script>
